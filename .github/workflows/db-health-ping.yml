name: DB Health Ping

on:
  schedule:
    # GitHub Actions enforces a 5-minute floor on scheduled workflows
    # (a shorter expression is silently ignored/coalesced), so this is
    # the closest to "every minute" the platform actually allows.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health/db
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "APP_URL secret is not set — add it under Settings > Secrets and variables > Actions once the app is deployed."
            exit 1
          fi

          response=$(curl -sS --fail-with-body "${{ secrets.APP_URL }}/api/health/db")
          echo "Response: $response"

          status=$(echo "$response" | jq -r '.status')
          if [ "$status" != "ok" ]; then
            echo "Database health check did not return status=ok"
            exit 1
          fi
